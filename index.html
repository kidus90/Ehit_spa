const gOf=j=>{const a=j+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153);return{y:100*b+d-4800+Math.floor(m/10),m:m+3-12*Math.floor(m/10),d:e-Math.floor((153*m+2)/5)+1}};

const toEt=ds=>{const[y,m,d]=ds.split('-').map(Number),e=eOf(jdnG(y,m,d));return{y:e.y,m:e.m-1,d:e.d}};

const QK='salonq';
const qLoad=()=>{try{return JSON.parse(localStorage.getItem(QK)||'[]')}catch(e){return[]}};
const qSave=a=>{try{localStorage.setItem(QK,JSON.stringify(a))}catch(e){}};
const isNet=e=>!navigator.onLine||/fetch|network|load failed|timed? ?out|abort/i.test(String((e&&e.message)||e));
function enqueue(fn,args,label,view){const a=qLoad();a.push({cid:args.p_client,fn,args,label,view,uid:me.id,at:Date.now()});qSave(a);qBar()}
function qBar(){const el=$('#qb');if(!el||!me)return;const a=qLoad().filter(x=>x.uid===me.id);let t='';
 if(!navigator.onLine)t+='<div class="qb off">You are offline</div>';
 if(a.length)t+=`<div class="qb"><div class="row"><span>${a.length} waiting to send</span>${btn('qsend','','Send now','ok')}</div>${a.filter(x=>x.err).map(x=>`<div class="row"><small>${h(x.label)} · ${h(x.err)}</small>${btn('qdrop',x.cid,'Discard','no')}</div>`).join('')}</div>`;
 el.innerHTML=t}
let flushing=false;
async function flushQ(force){if(flushing||!me||!navigator.onLine)return;flushing=true;let changed=false;
 try{let a=qLoad();for(const it of a.filter(x=>x.uid===me.id&&(force||!x.err))){delete it.err;
   const{error}=await SB.rpc(it.fn,it.args);
   if(!error){a=a.filter(x=>x.cid!==it.cid);qSave(a);changed=true}else if(isNet(error)){qSave(a);break}else{it.err=error.message;qSave(a)}}}
 catch(e){}finally{flushing=false}
 qBar();if(changed&&ctx.rid&&ctx.r&&!ctx.sheet)entry(ctx.rid).catch(()=>{})}

async function refreshPeople(){const{data}=await SB.from('profiles').select('*');people=Object.fromEntries((data||[]).map(x=>[x.id,x]))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){e.preventDefault();if(b.disabled)return;b.disabled=true;Promise.resolve().then(()=>A[b.dataset.a](b.dataset.i,b)).catch(()=>{}).finally(()=>{b.disabled=false})}});
document.addEventListener('input',e=>{const n=e.target.dataset.f;if(!n)return;ctx.f[n]=e.target.value;if((n==='cash'||n==='tip')&&$('#trv'))$('#trv').value=(cartTotal()-(+ctx.f.cash||0)).toFixed(2);if(n==='tip'&&$('#sb'))$('#sb').textContent=(ctx.edit?'Save changes':'Save sale')+' · '+etb(cartTotal())});
let hiddenAt=0;
function softRefresh(){const y=window.scrollY;let p=null;
 if(view==='today')p=ctx.rid?todayB().then(b=>{ctx.from=null;setDay(b)}):go();
 else if(view==='days')p=ctx.from&&ctx.rid?entry(ctx.rid):days();
 else if(view==='reports')p=reports();else if(view==='log')p=log();
 if(p)Promise.resolve(p).then(()=>window.scrollTo(0,y)).catch(()=>{})}
function maybeRefresh(minAway){if(!me||!navigator.onLine)return;flushQ();pendBadge();
 if(Date.now()-hiddenAt<minAway||busy||ctx.sheet||document.querySelector('.mdl'))return;
 if([...document.querySelectorAll('#m input:not([type=checkbox]):not([type=button]),#m textarea')].some(i=>i.value))return;
 softRefresh()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}maybeRefresh(30000)});
window.addEventListener('online',()=>maybeRefresh(0));
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
document.documentElement.lang=lang==='am'?'am':'en';
SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&me){if(WB)try{WB.clearAll()}catch(e){}cClear(me.id);me=null;ctx.pre=null;loginScreen('Session expired. Please sign in again.')}});
boot();
